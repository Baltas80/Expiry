name: Localization Check

on:
  push:
    paths:
      - 'app/src/main/res/values*/strings.xml'
      - '.github/workflows/localization-check.yml'
  pull_request:
    paths:
      - 'app/src/main/res/values*/strings.xml'
      - '.github/workflows/localization-check.yml'

jobs:
  localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check localized string keys
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path('app/src/main/res')
          default = root / 'values' / 'strings.xml'
          key_re = re.compile(r'<string\s+name="([^"]+)"')
          default_keys = set(key_re.findall(default.read_text(encoding='utf-8')))
          # Rewards is an intentionally inactive, forward-compatible resource.
          # It is not required to be present in every locale until the feature is enabled.
          default_keys.discard('settings_rewards')
          if not default_keys:
              raise SystemExit('No default string resources found')

          failed = False
          for path in sorted(root.glob('values-*/strings.xml')):
              keys = set(key_re.findall(path.read_text(encoding='utf-8')))
              missing = sorted(default_keys - keys)
              if missing:
                  failed = True
                  print(f'{path}: missing {len(missing)} keys: {", ".join(missing)}')
              else:
                  print(f'{path}: OK ({len(keys)} keys)')
          if failed:
              raise SystemExit(1)
          PY
