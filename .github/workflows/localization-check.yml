name: Localization Check

on:
  push:
    paths:
      - 'app/src/main/res/values*/strings.xml'
      - '.github/workflows/localization-check.yml'
  pull_request:
    paths:
      - 'app/src/main/res/values*/strings.xml'
      - '.github/workflows/localization-check.yml'

jobs:
  localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check localized string keys and translation coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import re
          from pathlib import Path

          root = Path('app/src/main/res')
          default = root / 'values' / 'strings.xml'
          key_re = re.compile(r'<string\s+name="([^"]+)"')
          default_text = default.read_text(encoding='utf-8')
          default_keys = set(key_re.findall(default_text))
          # Rewards is an intentionally inactive, forward-compatible resource.
          # The new 1.0.6 visual copy is allowed to fall back to the default
          # Spanish resources in locales that have not been translated yet.
          fallback_keys = {
              'settings_rewards',
              'hero_title',
              'hero_subtitle',
              'quick_actions',
              'premium_recommended',
              'premium_annual_label',
              'premium_monthly_label',
              'active_products_label',
              'total_scans_label',
              'consumed_registered_label',
              'discarded_registered_label',
          }
          required_keys = default_keys - fallback_keys

          if not default_keys:
              raise SystemExit('No default string resources found')

          default_hash = hashlib.sha256(default_text.encode('utf-8')).hexdigest()
          failed = False
          placeholder_locales = []

          for path in sorted(root.glob('values-*/strings.xml')):
              text = path.read_text(encoding='utf-8')
              keys = set(key_re.findall(text))
              missing = sorted(required_keys - keys)
              if missing:
                  failed = True
                  print(f'{path}: missing {len(missing)} keys: {", ".join(missing)}')
                  continue

              locale_hash = hashlib.sha256(text.encode('utf-8')).hexdigest()
              if locale_hash == default_hash:
                  locale = path.parent.name.removeprefix('values-')
                  placeholder_locales.append(locale)
                  print(f'::warning file={path}::Locale {locale} is byte-identical to the default Spanish resources; translation is not yet localized.')
              else:
                  print(f'{path}: OK ({len(keys)} keys)')

          if placeholder_locales:
              print('Placeholder locales (non-blocking): ' + ', '.join(placeholder_locales))
              print('These locales pass key parity but still require human-quality translations before release.')
          if failed:
              raise SystemExit(1)
          PY
