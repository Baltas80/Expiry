name: Android build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - run: gradle clean test
      - run: gradle lint
      - run: gradle assembleDebug
      - name: Prepare optional production keystore
        if: ${{ secrets.EXPIRY_KEYSTORE_BASE64 != '' }}
        env:
          EXPIRY_KEYSTORE_BASE64: ${{ secrets.EXPIRY_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$EXPIRY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/expiry-upload-key.jks"
          chmod 600 "$RUNNER_TEMP/expiry-upload-key.jks"
      - name: Build release bundle
        env:
          EXPIRY_KEYSTORE_PATH: ${{ runner.temp }}/expiry-upload-key.jks
          EXPIRY_KEYSTORE_PASSWORD: ${{ secrets.EXPIRY_KEYSTORE_PASSWORD }}
          EXPIRY_KEY_ALIAS: ${{ secrets.EXPIRY_KEY_ALIAS }}
          EXPIRY_KEY_PASSWORD: ${{ secrets.EXPIRY_KEY_PASSWORD }}
        run: gradle bundleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: expiry-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: expiry-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
